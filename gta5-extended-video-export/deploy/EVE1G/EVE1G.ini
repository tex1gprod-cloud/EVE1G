; EVE1G 0.9.0-beta by TEX1G - Rockstar Editor export for FiveM (ReShade + motion blur, clean capture).
; Easiest way to change this file: EVE1G-Settings.exe in this folder. Read again at the start of every export.

enable_mod = true
auto_reload_config = true
; Empty = your Windows Videos folder
output_folder =
; error / warn / info / debug
log_level = info

; File naming: <project>_<shot>_t<take>_<fps>fps_<samples>s_<shutter>.<ext>
; Leave project and shot empty for EVE1G-<date><time>. take = 0 picks the next free take number.
project =
shot =
take = 0
; Write a .txt next to every video with the settings it was made with
sidecar = true

[EXPORT]
fps = 24
; Motion blur: the game renders (samples + 1) frames per video frame and blends them. 0 = off.
; Audio is only exported while fps * (samples + 1) stays at or below 60.
motion_blur_samples = 16
; Share of each frame's interval that is blended = shutter angle / 360 (0.5 = 180 degrees)
motion_blur_strength = 0.500
; Real camera: blend in linear light like a sensor (bright lights streak) and fade the shutter in / out
;   like a rotary shutter. false = the old display-image blend with a hard shutter.
blend_linear = false
shutter_soft = 0
; Rolling shutter: ms the sensor takes to read the image top to bottom (0 = global shutter, like a
;   cinema camera; 8-25 = mirrorless / phone - fast pans lean). Needs motion blur samples.
rolling_shutter_ms = 0
export_openexr = false

; clean   = frame taken before the game UI, your ReShade preset applied (no progress bar, no cursor)
; present = what is on screen (includes the progress bar and cursor)
; encode  = Rockstar's export image, no ReShade
; effects = experimental;  legacy = original EVE (black with the GTA V Upscaler)
capture_source = clean
; clean: apply your ReShade preset (DOF, grade) to the video
clean_reshade = true
; clean: true = the screen shows the finished frame while exporting (DOF visible for focus pulls,
;   no progress bar); false = the screen shows the game with its UI but without ReShade
clean_preview = true
; Hide the game UI (export progress bar, buttons, spinner) while exporting
hide_ui = true
; Export progress (%, frames, time left) in a corner of the screen - drawn by ReShade after the frame
;   is captured, so it is never in the video (only shown with capture clean / encode / effects)
progress_osd = true
; Its size: 1 = normal (it already grows with the screen, 2x at 4K), 1.5 = large, 2 = extra large
osd_scale = 1
; Focus Puller camera files (After Effects .jsx / Blender .py / .csv) with every export: false = only the video
camera_files = false
; ...in a "camera" folder next to the video (false = right beside it)
camera_folder = true
; When an export finishes: a sound, the taskbar button flashes and a note shows on screen
notify_done = false
; Frames into the encoder at 16 bits per channel: auto = for 10/12-bit and lossless formats,
;   true = always, false = 8-bit like original EVE (use if an export fails to start)
master_16bit = false

[DEPTH]
; Depth pass: a depth map exported with every video, frame for frame (needs EVE1G_Depth.fx in reshade-shaders\Shaders)
enabled = false
; png16  = 16-bit grayscale PNG sequence (lossless; After Effects / Premiere / Resolve)
; prores = ProRes 4444 .mov next to the video (one file, 10-bit)
; exr    = 32-bit float OpenEXR sequence, channel Z = distance in metres (Nuke / Fusion / AE)
format = png16
; png16 / prores: the distance range mapped from white to black (metres), the curve and which end is white
; range = auto: near / far worked out from the first frame of each clip (full black to white). fixed: the near / far below
range = auto
near = 0.5
far = 200
; log = more detail close up (recommended), linear = even steps
curve = log
; near = close things are white (Lens Blur / fog mattes), far = far things are white
white = near

[HFR]
; HFR export: every game frame also saved unblended (fps x (samples + 1)), no audio
enabled = false
; prores = ProRes 422 HQ .mov,  png = PNG sequence
format = prores
; keep every Nth game frame (1 = all)
every = 1

[PASSES]
; More files with every video, frame for frame:
; clean_plate = <video>_plate.mov, the same shot without the ReShade preset (needs capture_source = clean)
clean_plate = false
; proxy = <video>_proxy.mp4, half size H.264 for fast editing
proxy = false
; normals = surface normals from the depth, in the [DEPTH] format (needs EVE1G_Depth.fx)
normals = false
; field of view for the normals when Focus Puller is not running (degrees, vertical)
normals_fov = 50
; id_pass = EXPERIMENTAL colour matte from the game's stencil buffer, PNG sequence + legend
id_pass = false
